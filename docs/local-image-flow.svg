<svg xmlns="http://www.w3.org/2000/svg" width="820" height="170" viewBox="0 0 820 170" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    .box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
    .tt { font-size: 13px; font-weight: 700; fill: #0f172a; }
    .mono { font-size: 12px; fill: #2563eb; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .small { font-size: 11px; fill: #64748b; }
  </style>

  <text x="24" y="30" class="tt">本地图片 → HTTP 地址 → 填到设置面板</text>

  <rect x="24" y="50" width="230" height="90" rx="10" class="box"/>
  <text x="139" y="78" text-anchor="middle" class="tt">1 · 本地图片目录</text>
  <text x="139" y="100" text-anchor="middle" class="mono">~/.dsh/custom-css/assets</text>
  <text x="139" y="120" text-anchor="middle" class="small">把 bg.png 放进这个文件夹</text>

  <line x1="262" y1="95" x2="296" y2="95" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="304" y="50" width="230" height="90" rx="10" class="box"/>
  <text x="419" y="78" text-anchor="middle" class="tt">2 · HTTP 地址</text>
  <text x="419" y="100" text-anchor="middle" class="mono">/api/custom-css/assets/bg.png</text>
  <text x="419" y="120" text-anchor="middle" class="small">由插件通过 HTTP 提供给页面</text>

  <line x1="542" y1="95" x2="576" y2="95" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="584" y="50" width="212" height="90" rx="10" class="box"/>
  <text x="690" y="78" text-anchor="middle" class="tt">3 · 填到设置面板</text>
  <text x="690" y="100" text-anchor="middle" class="small">背景图片地址 / 左侧图片 / 右侧图片</text>
  <text x="690" y="120" text-anchor="middle" class="small">保存后立即生效</text>
</svg>
